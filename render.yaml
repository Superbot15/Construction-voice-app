services:
  - type: web
    name: spec-voice-terminal
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
