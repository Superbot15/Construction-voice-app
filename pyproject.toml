[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "civil-ai"
version = "0.1.0"
description = "Document intelligence and submittal compliance checking for heavy civil construction."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["construction", "civil-engineering", "submittals", "compliance", "document-parsing"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing",
]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
civil-ai = "civil_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/civil_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
